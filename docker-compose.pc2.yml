# SCAD em 2 computadores: PC2 (armazém de Nampula: mestre, réplica e agente)
# Uso: docker compose -f docker-compose.pc2.yml --env-file multi/ips.env up -d --build
name: scad-nampula

services:

  # ===================== NAMPULA =====================
  db-nampula:
    image: postgres:16
    command: ["postgres", "-c", "max_prepared_transactions=10", "-c", "cluster_name=db-nampula"]
    environment:
      POSTGRES_DB: scad
      POSTGRES_PASSWORD: scad
    ports: ["5443:5432"]
    volumes:
      - dados-nampula:/var/lib/postgresql/data
      - ./db/00-replicacao.sh:/docker-entrypoint-initdb.d/00-replicacao.sh
      - ./db/comum.sql:/docker-entrypoint-initdb.d/01-comum.sql
      - ./db/nampula.sql:/docker-entrypoint-initdb.d/02-fragmento.sql
    networks: [scad-net]

  db-nampula-rep:
    image: postgres:16
    user: postgres
    entrypoint: ["bash", "/replica.sh"]
    environment:
      PRIMARIO: db-nampula
      NOME_NO: db-nampula-rep
      REPL_PASS: replica
    ports: ["5453:5432"]
    volumes:
      - dados-nampula-rep:/var/lib/postgresql/data
      - ./db/replica.sh:/replica.sh
    depends_on: [db-nampula]
    networks: [scad-net]

  # ===================== AGENTE =====================
  agente-nampula:
    build: ./agente
    environment:
      REGIAO: Nampula
      DESVIO_S: "-10"
      BERKELEY_MESTRE: "false"
      DB_URL: jdbc:postgresql://db-nampula:5432,db-nampula-rep:5432/scad?targetServerType=preferPrimary
      DB_PASS: scad
      PARES: http://agente-maputo:8080,http://agente-beira:8080
    ports: ["8083:8080"]
    depends_on: [db-nampula, db-nampula-rep]
    networks: [scad-net]

  # ===================== PONTE PARA O PC1 =====================
  # Dentro da rede scad-net do PC2, os nomes dos serviços do PC1 apontam para esta ponte,
  # que reencaminha cada pedido para a porta certa do PC1.
  ponte:
    image: nginx:1.27-alpine
    environment:
      PC1: ${PC1}
    volumes:
      - ./multi/ponte-pc2.conf.template:/etc/nginx/templates/default.conf.template
    networks:
      scad-net:
        aliases: [agente-maputo, agente-beira, fornecedor-rest, fornecedor-soap, namenode, datanode1, datanode2, datanode3]

networks:
  scad-net:

volumes:
  dados-nampula:
  dados-nampula-rep:
