server.port=8080

# Identidade do no e enderecos dos outros nos (vem do Docker Compose)
scad.regiao=${REGIAO:Maputo}
scad.pares=${PARES:}

# Base de dados regional (mestre + replica, com failover no driver JDBC)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5441/scad}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:scad}
spring.datasource.hikari.connection-timeout=5000
# Renova as ligacoes a cada minuto: quando o mestre volta, o no deixa a replica e volta a aceitar escritas
spring.datasource.hikari.max-lifetime=60000



# Relogio: desvio simulado (s) e mestre do algoritmo de Berkeley
scad.desvio-s=${DESVIO_S:0}
scad.berkeley-mestre=${BERKELEY_MESTRE:false}

# Login do painel. O cookie tem nome por regiao porque os cookies nao distinguem portas em localhost
scad.painel.senha=${PAINEL_SENHA:admin1234}
server.servlet.session.cookie.name=SCAD_${scad.regiao}
server.servlet.session.cookie.same-site=lax

# Tempo (s) entre a ordem e a chegada da mercadoria ao armazem
scad.entrega-s=${ENTREGA_S:30}
# Intervalo (s) entre rondas automaticas de Berkeley
scad.berkeley-s=${BERKELEY_S:30}
# Tempo (s) ate um participante perguntar a decisao de uma transacao 2PC que ficou preparada
scad.tx-termino-s=${TX_TERMINO_S:120}
# Uma compra pode demorar: sem varias threads bloquearia o heartbeat e as entregas
spring.task.scheduling.pool.size=8
