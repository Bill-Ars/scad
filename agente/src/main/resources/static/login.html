<!doctype html>
<html lang="pt" data-tema="claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCAD · Entrar</title>
<link rel="icon" href="data:,">
<script>try { document.documentElement.setAttribute('data-tema', localStorage.getItem('scad-tema') || 'claro'); } catch (e) {}</script>
<style>
  :root, [data-tema="escuro"]{ --bg:#0b1014; --card:#131c22; --line:#22303a; --ink:#e6edf1; --muted:#8a9aa5; --accent:#2ee59d; --glow:rgba(46,229,157,.18); --bad:#ff6b6b; --btn-ink:#06281a; }
  [data-tema="oceano"]{ --bg:#071226; --card:#0d1f3d; --line:#1c3463; --ink:#e4ecfa; --muted:#8ea3c7; --accent:#38bdf8; --glow:rgba(56,189,248,.20); --bad:#fb7185; --btn-ink:#04223a; }
  [data-tema="claro"]{ --bg:#eef2f7; --card:#ffffff; --line:#dde3eb; --ink:#14202b; --muted:#5d6b78; --accent:#4f46e5; --glow:rgba(79,70,229,.10); --bad:#dc2626; --btn-ink:#ffffff; }
  *{box-sizing:border-box}
  html{color-scheme:dark} [data-tema="claro"]{color-scheme:light}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;color:var(--ink);font:14px "Segoe UI",Inter,system-ui,sans-serif;
       background:radial-gradient(1200px 600px at 10% -10%,var(--glow),transparent 60%),var(--bg)}
  form{width:100%;max-width:340px;display:grid;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px}
  h1{margin:0;font-size:20px} p{margin:0;color:var(--muted)}
  label{font-weight:600;font-size:13px;display:grid;gap:6px;margin-top:6px}
  input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
  input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  button{font:inherit;font-weight:600;color:var(--btn-ink);background:var(--accent);border:0;border-radius:10px;padding:11px;cursor:pointer}
  #erro{color:var(--bad)} [hidden]{display:none}
</style>
</head>
<body>
<form method="post" action="/login">
  <h1>SCAD</h1>
  <p>Gestão de Stock e Compras</p>
  <label>Senha<input type="password" name="senha" autocomplete="current-password" required autofocus></label>
  <p id="erro" role="alert" hidden>Senha incorreta.</p>
  <button type="submit">Entrar</button>
</form>
<script>document.getElementById('erro').hidden = !location.search.includes('erro');</script>
</body>
</html>
